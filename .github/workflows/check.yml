name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed python nodejs xorg-xcursorgen hyprcursor git
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in install.sh uninstall.sh web-install.sh hooks/*; do bash -n "$f"; done
      - name: Checks
        run: python3 tests/check.py
