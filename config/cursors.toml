# Omarchy Cursor - Cursor metadata configuration
# Hotspots are in 256x256 canvas coordinates.
# Symlinks provide compatibility aliases.

[fallback]
canvas_size = 256
x_hotspot = 128
y_hotspot = 128
sizes = [24, 32, 48, 64, 96]
animation_delay = 40
animation_frames = 54
stroke_width = 17

# ── Pointers ──────────────────────────────────────────────

