[project]
name = "omarchy-cursor"
version = "1.0.0"
description = "Original cursor theme for Omarchy with theme-aware colorization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.7",
]

[project.scripts]
omarchy-cursor = "omarchy_cursor.render:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
